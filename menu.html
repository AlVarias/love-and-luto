<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Love and Luto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .hide { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- ADMIN DASHBOARD UI -->
    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-end mb-8 border-b pb-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">🧑‍🍳 Love and Luto Dashboard</h1>
                <p class="text-gray-600">Manage your menu, upload photos, and generate your updated website.</p>
            </div>
            <button onclick="downloadWebsite()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                📥 Download Updated Website
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- LEFT COLUMN: GLOBAL SETTINGS & SECTIONS -->
            <div class="space-y-6">
                <!-- Phone Setting -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">📞 Store Settings</h2>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">WhatsApp / SMS Number</label>
                    <input type="text" id="storePhone" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-brand" onchange="saveGlobalSettings()">
                    <p class="text-xs text-gray-500 mt-1">Include country code, no + or spaces (e.g., 642041280989).</p>
                </div>

                <!-- Sections Nav -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">📁 Menu Categories</h2>
                    <div id="sectionNav" class="space-y-2">
                        <!-- Nav items injected here -->
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: MENU ITEMS MANAGER -->
            <div class="lg:col-span-2">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex justify-between items-center mb-6 border-b pb-2">
                        <h2 id="currentSectionTitle" class="text-xl font-bold text-gray-800">🥖 Made-to-Order Breads</h2>
                        <button onclick="openItemModal()" class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-bold py-2 px-4 rounded-lg shadow transition-colors">
                            + Add New Item
                        </button>
                    </div>

                    <div id="itemsContainer" class="space-y-4">
                        <!-- Items injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ITEM EDIT MODAL -->
    <div id="itemModal" class="fixed inset-0 bg-black bg-opacity-60 hide items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-2xl font-bold text-gray-800 font-serif">Add Menu Item</h3>
                <button onclick="closeItemModal()" class="text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            </div>
            
            <form id="itemForm" class="space-y-5">
                <input type="hidden" id="m_id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Item Title</label>
                        <input type="text" id="m_title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
                        <select id="m_section" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="breads">Breads</option>
                            <option value="viands">Viands</option>
                            <option value="soups">Soups</option>
                            <option value="desserts">Desserts</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                    <textarea id="m_desc" rows="2" class="w-full px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-orange-500"></textarea>
                </div>

                <!-- Image Upload (Compresses to Base64) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Upload Picture</label>
                    <div class="flex items-center gap-4">
                        <img id="m_img_preview" src="https://placehold.co/100x100?text=No+Image" class="w-16 h-16 object-cover rounded-lg border border-gray-200">
                        <input type="file" id="m_img_upload" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100" onchange="processImageUpload(event)">
                        <input type="hidden" id="m_img_base64">
                    </div>
                    <p class="text-xs text-gray-400 mt-1">Images are automatically compressed so your website stays fast.</p>
                </div>

                <!-- Tags & Status -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-3">Tags & Status</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" id="m_veg" class="rounded text-orange-500 focus:ring-orange-500 h-4 w-4"> <span>🍃 Vegetarian</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" id="m_gf" class="rounded text-orange-500 focus:ring-orange-500 h-4 w-4"> <span>🌾 Gluten-Free</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm text-gray-700 cursor-pointer">
                            <input type="checkbox" id="m_nuts" class="rounded text-orange-500 focus:ring-orange-500 h-4 w-4"> <span>🥜 Contains Nuts</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm font-bold text-pink-600 cursor-pointer">
                            <input type="checkbox" id="m_loves" class="rounded text-pink-500 focus:ring-pink-500 h-4 w-4"> <span>❤️ Love's Choice Badge</span>
                        </label>
                        <label class="flex items-center space-x-2 text-sm font-bold text-red-600 cursor-pointer mt-2 pt-2 border-t border-gray-200 col-span-2">
                            <input type="checkbox" id="m_soldout" class="rounded text-red-500 focus:ring-red-500 h-4 w-4"> <span>Mark as SOLD OUT</span>
                        </label>
                    </div>
                </div>

                <!-- Pricing Options -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-sm font-semibold text-gray-700">Pricing Options</label>
                        <button type="button" onclick="addModalPricingRow()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded font-semibold">+ Add Option</button>
                    </div>
                    <div id="modalPricingContainer" class="space-y-2">
                        <!-- Rows injected here -->
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeItemModal()" class="px-5 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-semibold transition-colors">Cancel</button>
                    <button type="button" onclick="saveItem()" class="px-5 py-2 rounded-lg bg-orange-500 hover:bg-orange-600 text-white font-semibold transition-colors shadow-md">Save Menu Item</button>
                </div>
            </form>
        </div>
    </div>


    <!-- ========================================================= -->
    <!-- HIDDEN TEMPLATES TO GENERATE INDEX.HTML -->
    <!-- ========================================================= -->

    <template id="tpl-top">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love and Luto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#ffedd5',
                            DEFAULT: '#f97316',
                            dark: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #ffedd5; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c2410c; }
        .fade-in { animation: fadeIn 1.2s cubic-bezier(0.39, 0.57, 0.04, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .price-badge { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(4px); }
        .chef-logo { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .chef-logo:hover { transform: rotate(8deg) scale(1.15); }
        #cartSidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .cart-open { transform: translateX(0%); }
        .cart-closed { transform: translateX(100%); }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .heart-icon { animation: heartbeat 1.5s infinite ease-in-out; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.5); } 100% { transform: scale(1); } }
        .animate-pop { animation: pop 0.3s ease-out; }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
        .delay-300 { transition-delay: 300ms; }
        .unavailable-overlay { display: none; }
        .is-unavailable .unavailable-overlay { display: flex; }
        .is-unavailable .add-to-cart-section { display: none; }
        .is-unavailable { opacity: 0.75; filter: grayscale(60%); pointer-events: none; }
    </style>
</head>
<body class="bg-brand-light text-gray-800 font-[Poppins] antialiased overflow-x-hidden relative">

    <nav class="bg-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center cursor-pointer group" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                    <img src="logo.png" onerror="this.src='https://placehold.co/100x100/f97316/white?text=Logo'" class="w-12 h-12 rounded-full chef-logo shadow-sm border border-brand/20 object-cover" alt="Love and Luto Logo">
                    <span class="ml-3 font-[Playfair_Display] font-bold text-2xl text-brand-dark group-hover:text-brand transition duration-300">Love and Luto</span>
                </div>
                <div class="hidden lg:flex space-x-6 text-sm">
                    <a href="#about" class="text-gray-600 hover:text-brand transition font-medium">About Me</a>
                    <a href="#how-it-works" class="text-gray-600 hover:text-brand transition font-medium">How it Works</a>
                    <a href="#breads" class="text-gray-600 hover:text-brand transition font-medium">Breads</a>
                    <a href="#viands" class="text-gray-600 hover:text-brand transition font-medium">Viands</a>
                    <a href="#desserts" class="text-gray-600 hover:text-brand transition font-medium">Desserts</a>
                </div>
                <div>
                    <button onclick="toggleCart()" class="relative bg-brand hover:bg-brand-dark text-white px-5 py-2 rounded-full font-semibold transition shadow-md flex items-center hover:scale-105 transform duration-300">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        Cart
                        <span id="cartCountBadge" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden shadow-sm">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <button onclick="toggleCart()" class="md:hidden fixed bottom-6 right-6 z-40 bg-brand text-white p-4 rounded-full shadow-2xl flex items-center justify-center transform hover:scale-110 transition-transform duration-300">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
        <span id="floatCartBadge" class="absolute 0 top-0 right-0 bg-red-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden border border-white transform translate-x-1/4 -translate-y-1/4 shadow-sm">0</span>
    </button>

    <header class="relative bg-gradient-to-br from-brand to-red-600 text-white overflow-hidden">
        <div class="absolute inset-0 bg-black opacity-30"></div>
        <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-24 md:py-32 flex flex-col items-center text-center fade-in">
            <span class="bg-white/20 text-white px-4 py-1 rounded-full text-sm font-bold tracking-widest uppercase mb-4 backdrop-blur-sm border border-white/40">100% Made To Order</span>
            <h1 class="text-5xl md:text-7xl font-[Playfair_Display] font-bold mb-6 tracking-tight animate-float drop-shadow-lg">Taste of Home Cooking! 🍲</h1>
            <p class="text-xl md:text-2xl font-light mb-10 max-w-2xl drop-shadow-md">Handcrafted Filipino Breads, Hearty Viands & Soul-Warming Soups made with love exclusively for your order.</p>
        </div>
        <div class="absolute bottom-0 w-full overflow-hidden leading-none">
            <svg class="relative block w-full h-12 md:h-24" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V95.8C59.71,118,130.98,131.1,200.7,121.15,242.44,115.15,283.47,105.15,321.39,56.44Z" fill="#ffedd5"></path>
            </svg>
        </div>
    </header>

    <div class="reveal max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 flex flex-wrap justify-center gap-4 md:gap-6 text-sm text-gray-600 font-medium">
        <span class="flex items-center"><span class="text-lg mr-1">🍃</span> Vegetarian</span>
        <span class="flex items-center"><span class="text-lg mr-1">🥜</span> Contains Nuts</span>
        <span class="flex items-center"><span class="text-lg mr-1">🌾</span> Gluten-Free</span>
        <span class="flex items-center text-pink-500 font-bold"><svg class="w-4 h-4 mr-1 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> Love's Choice</span>
    </div>

    <main id="menu" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    </template>

    <template id="tpl-bottom">
    </main>

    <section id="how-it-works" class="bg-brand-light/50 py-16 border-y border-brand/20 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="reveal text-center mb-12">
                <h2 class="text-3xl font-[Playfair_Display] font-bold text-brand-dark mb-4">How It Works</h2>
                <p class="text-gray-600">Simple ordering, home-cooked goodness.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="reveal delay-100 bg-white p-8 rounded-2xl shadow-sm text-center transform transition duration-300 hover:-translate-y-1 hover:shadow-md">
                    <div class="w-16 h-16 bg-brand-light text-brand rounded-full flex items-center justify-center text-3xl mx-auto mb-4">🛒</div>
                    <h3 class="font-bold text-xl mb-2 text-gray-800">1. Place Your Order</h3>
                    <p class="text-gray-600 text-sm">Add items to your cart and check out via WhatsApp or SMS. I'll reply quickly to confirm the details and total price.</p>
                </div>
                <div class="reveal delay-200 bg-white p-8 rounded-2xl shadow-sm text-center transform transition duration-300 hover:-translate-y-1 hover:shadow-md">
                    <div class="w-16 h-16 bg-brand-light text-brand rounded-full flex items-center justify-center text-3xl mx-auto mb-4">👩‍🍳</div>
                    <h3 class="font-bold text-xl mb-2 text-gray-800">2. Made With Love</h3>
                    <p class="text-gray-600 text-sm">Please allow <strong>24 to 48 hours</strong> lead time! Since everything is made from scratch for your specific order, I need time to prep.</p>
                </div>
                <div class="reveal delay-300 bg-white p-8 rounded-2xl shadow-sm text-center transform transition duration-300 hover:-translate-y-1 hover:shadow-md">
                    <div class="w-16 h-16 bg-brand-light text-brand rounded-full flex items-center justify-center text-3xl mx-auto mb-4">🚗</div>
                    <h3 class="font-bold text-xl mb-2 text-gray-800">3. Pick-up or Delivery</h3>
                    <p class="text-gray-600 text-sm">We can arrange local pickup, or I can deliver to you in the Auckland area. (Remember, delivery is FREE for orders over $100!).</p>
                    <p class="text-xs text-gray-400 mt-3 font-semibold">Payment via Bank Transfer or Cash upon receipt.</p>
                </div>
            </div>
        </div>
    </section>

    <section class="py-16 bg-white overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="reveal text-center mb-12">
                <h2 class="text-3xl font-[Playfair_Display] font-bold text-brand-dark mb-4">Happy Bellies</h2>
                <p class="text-gray-600">What my friends and customers are saying!</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="reveal delay-100 bg-gray-50 p-6 rounded-2xl border border-gray-100 shadow-sm relative">
                    <div class="text-brand text-xl mb-3 hover:scale-110 transition-transform cursor-default">⭐⭐⭐⭐⭐</div>
                    <p class="text-gray-600 italic mb-4">"Absolutely the softest Pandesal in Auckland! Tastes just like the bakeries back home in the Philippines."</p>
                    <p class="font-bold text-sm text-gray-800">- Marry Ann D.</p>
                </div>
                <div class="reveal delay-200 bg-gray-50 p-6 rounded-2xl border border-gray-100 shadow-sm relative">
                    <div class="text-brand text-xl mb-3 hover:scale-110 transition-transform cursor-default">⭐⭐⭐⭐⭐</div>
                    <p class="text-gray-600 italic mb-4">"That Beef Kansi is unbelievable. The broth is so rich and perfectly sour. We ordered a party tray for a birthday and it was gone in minutes!"</p>
                    <p class="font-bold text-sm text-gray-800">- Orlando and Family</p>
                </div>
                <div class="reveal delay-300 bg-gray-50 p-6 rounded-2xl border border-gray-100 shadow-sm relative">
                    <div class="text-brand text-xl mb-3 hover:scale-110 transition-transform cursor-default">⭐⭐⭐⭐⭐</div>
                    <p class="text-gray-600 italic mb-4">"The Tofu Sisig is a total game changer for vegetarians. It's sizzling, savory, and you don't even miss the meat."</p>
                    <p class="font-bold text-sm text-gray-800">- Bryan P.</p>
                </div>
            </div>
        </div>
    </section>

    <section id="about" class="bg-white py-16 md:py-24 border-t border-brand/20 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col lg:flex-row items-center gap-12">
                <div class="reveal lg:w-1/2">
                    <div class="flex items-center mb-6">
                        <div class="h-1 w-8 bg-brand rounded"></div>
                        <h2 class="text-3xl md:text-4xl font-[Playfair_Display] font-bold mx-4 text-brand-dark">The Story Behind the Food</h2>
                    </div>
                    <p class="text-gray-600 text-lg mb-4 leading-relaxed">Hi, I'm Allen! I'll let you in on a little secret: I'm not a professionally trained chef. By day, my real profession is a <strong>Systems Engineer</strong>. </p>
                    <p class="text-gray-600 text-lg mb-4 leading-relaxed">I moved here to New Zealand for my amazing partner. My culinary journey didn't start in a culinary school; it started in our kitchen, simply trying to cook the authentic Filipino dishes she missed and loved. Everything you see on this menu started as a meal made with love for my soon-to-be fiancée (and soon-to-be wife!).</p>
                    <p class="text-gray-600 text-lg mb-8 leading-relaxed">Now, I pour that exact same love, care, and dedication into every single batch I make for you. From kneading dough to slow-simmering broths, it's all about sharing a taste of home.</p>
                    <a href="https://alvarias.github.io/" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-brand font-semibold hover:text-brand-dark transition-colors bg-brand-light/50 px-4 py-3 rounded-lg border border-brand/20 shadow-sm hover:shadow-md hover:-translate-y-1 transform duration-300">
                        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        Meet the Engineer Behind the Food
                    </a>
                </div>
                <div class="reveal delay-200 lg:w-1/2 grid grid-cols-2 gap-4">

        <svg class="w-5 h-5 mr-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span id="toastMsg">Added to cart!</span>
    </div>

    <script>
        let cart = [];
        const phone = "__PHONE_NUMBER__"; 

        document.addEventListener('DOMContentLoaded', (event) => {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('custDate').min = tomorrow.toISOString().split('T')[0];

            const revealElements = document.querySelectorAll('.reveal');
            const revealOptions = { threshold: 0.15, rootMargin: "0px 0px -50px 0px" };
            const revealOnScroll = new IntersectionObserver(function(entries, observer) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target); 
                    }
                });
            }, revealOptions);
            revealElements.forEach(el => revealOnScroll.observe(el));
        });

        function toggleCart() {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('cartOverlay');
            if (sidebar.classList.contains('cart-closed')) {
                sidebar.classList.remove('cart-closed');
                sidebar.classList.add('cart-open');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('cart-closed');
                sidebar.classList.remove('cart-open');
                overlay.classList.add('hidden');
            }
        }

        function addToCart(baseName, selectId) {
            const selectElement = document.getElementById(selectId);
            const [priceStr, variant] = selectElement.value.split('|');
            const price = parseFloat(priceStr);
            const fullName = `${baseName} (${variant})`;
            const existingItem = cart.find(item => item.name === fullName);
            
            if (existingItem) existingItem.quantity += 1;
            else cart.push({ name: fullName, price: price, quantity: 1 });

            updateCartUI();
            showToast(`${fullName} added to cart!`);

            const badge1 = document.getElementById('cartCountBadge');
            const badge2 = document.getElementById('floatCartBadge');
            badge1.classList.remove('animate-pop');
            badge2.classList.remove('animate-pop');
            void badge1.offsetWidth; 
            badge1.classList.add('animate-pop');
            badge2.classList.add('animate-pop');
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) removeFromCart(index);
            else updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const totalEl = document.getElementById('cartTotal');
            const badge1 = document.getElementById('cartCountBadge');
            const badge2 = document.getElementById('floatCartBadge');
            let totalItems = 0; let totalPrice = 0;
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 mt-10">Your cart is empty. Let\\'s add some delicious food!</div>';
                badge1.classList.add('hidden'); badge2.classList.add('hidden');
            } else {
                badge1.classList.remove('hidden'); badge2.classList.remove('hidden');
                cart.forEach((item, index) => {
                    totalItems += item.quantity;
                    const itemTotal = item.price * item.quantity;
                    totalPrice += itemTotal;
                    const priceDisplay = item.price === 0 ? '<span class="text-orange-500">Custom Price</span>' : '$' + item.price.toFixed(2);
                    const itemTotalDisplay = item.price === 0 ? 'TBA' : '$' + itemTotal.toFixed(2);
                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center transform transition duration-300 hover:shadow-md">
                            <div class="flex-grow pr-2">
                                <h4 class="font-bold text-gray-800 text-sm leading-tight">${item.name}</h4>
                                <div class="text-brand font-semibold text-sm mt-1">${priceDisplay}</div>
                            </div>
                            <div class="flex items-center flex-col gap-2">
                                <div class="flex items-center bg-gray-100 rounded-lg shadow-inner">
                                    <button onclick="changeQuantity(${index}, -1)" class="w-8 h-8 text-gray-600 hover:bg-gray-200 hover:text-brand rounded-l-lg font-bold transition-colors">-</button>
                                    <span class="w-8 text-center font-bold text-sm text-gray-800">${item.quantity}</span>
                                    <button onclick="changeQuantity(${index}, 1)" class="w-8 h-8 text-gray-600 hover:bg-gray-200 hover:text-brand rounded-r-lg font-bold transition-colors">+</button>
                                </div>
                                <div class="text-xs text-gray-400 font-bold">${itemTotalDisplay}</div>
                            </div>
                        </div>`;
                });
            }
            badge1.innerText = totalItems; badge2.innerText = totalItems;
            
            let hasCustomPrice = cart.some(item => item.price === 0);
            totalEl.innerText = hasCustomPrice ? `$${totalPrice.toFixed(2)} + TBA` : `$${totalPrice.toFixed(2)}`;
            
            const deliveryNote = document.getElementById('deliveryNote');
            if (hasCustomPrice) {
                deliveryNote.innerText = "Free delivery on orders over $100 (Pending TBA items)";
                deliveryNote.className = "text-xs font-medium text-right mb-4 text-brand-dark";
            } else if (totalPrice >= 100) {
                deliveryNote.innerText = "✨ Free Delivery Unlocked!";
                deliveryNote.className = "text-sm font-bold text-right mb-4 text-green-600 animate-pulse";
            } else if (totalPrice > 0) {
                const amountLeft = (100 - totalPrice).toFixed(2);
                deliveryNote.innerText = `Add $${amountLeft} more for FREE delivery! (+ Delivery Fee)`;
                deliveryNote.className = "text-xs font-medium text-right mb-4 text-gray-500";
            } else {
                deliveryNote.innerText = "Free delivery on orders over $100!";
                deliveryNote.className = "text-xs font-medium text-right mb-4 text-gray-500";
            }
        }

        function openQrModal() {
            const modal = document.getElementById('qrModal');
            const content = document.getElementById('qrModalContent');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        }

        function closeQrModal() {
            const modal = document.getElementById('qrModal');
            const content = document.getElementById('qrModalContent');
            modal.classList.add('opacity-0'); content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
        }

        async function downloadQR() {
            const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=https://your-future-website.com";
            try {
                const response = await fetch(qrUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none'; a.href = url; a.download = 'Love_and_Luto_Menu_QR.png';
                document.body.appendChild(a); a.click();
                window.URL.revokeObjectURL(url); document.body.removeChild(a);
                showToast("QR Code downloading...");
                setTimeout(closeQrModal, 1000);
            } catch (e) { window.open(qrUrl, '_blank'); }
        }
        
        document.getElementById('qrModal').addEventListener('click', (e) => { if (e.target === document.getElementById('qrModal')) closeQrModal(); });

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = message;
            toast.classList.remove('opacity-0', 'translate-y-10');
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-10'); }, 3000);
        }

        function processCheckout(method) {
            const form = document.getElementById('checkoutForm');
            if (!form.reportValidity()) return; 
            if (cart.length === 0) { alert("Please add items to your cart first!"); return; }

            const name = document.getElementById('custName').value.trim();
            const dateReq = document.getElementById('custDate').value;
            const address = document.getElementById('custAddress').value.trim();
            
            let orderText = `*NEW ORDER FOR LOVE AND LUTO* 👨‍🍳\n\n*Name:* ${name}\n*Requested Date:* ${dateReq}\n*Address/Pickup Details:* ${address}\n\n*Orders:*\n`;
            let total = 0; let hasCustomPrice = false;
            
            cart.forEach(item => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;
                let itemTotalDisplay = item.price === 0 ? 'Price TBA' : '$' + itemTotal.toFixed(2);
                if (item.price === 0) hasCustomPrice = true;
                orderText += `▪️ ${item.quantity}x ${item.name} - ${itemTotalDisplay}\n`;
            });
            
            if (hasCustomPrice) {
                orderText += `\n*TOTAL ESTIMATE:* $${total.toFixed(2)} + Custom Items\n*Delivery:* Free if final total > $100 (otherwise standard fee applies)\n\n`;
            } else {
                orderText += `\n*SUBTOTAL:* $${total.toFixed(2)}\n`;
                if (total >= 100) orderText += `*Delivery:* FREE ✨\n\n`;
                else orderText += `*Delivery:* Additional fee applies\n\n`;
            }
            orderText += `Please confirm my order. Thank you!`;

            if (method === 'whatsapp') window.open(`https://wa.me/${phone}?text=${encodeURIComponent(orderText)}`, '_blank');
            else if (method === 'sms') window.location.href = `sms:+${phone}?body=${encodeURIComponent(orderText)}`;
        }
    </script>
</body>

        // State variables
        let appData = JSON.parse(localStorage.getItem('loveAndLutoData')) || DEFAULT_DATA;
        let currentEditId = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('storePhone').value = appData.phone || "";
            renderDashboard();
        });

        function saveGlobalSettings() {
            appData.phone = document.getElementById('storePhone').value.trim();
            saveData();
        }

        function saveData() {
            localStorage.setItem('loveAndLutoData', JSON.stringify(appData));
            renderDashboard();
        }

        // Image Compression Logic
        function processImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600; // Compress width
                    const scaleSize = MAX_WIDTH / img.width;
                    
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // Compress to JPEG 80% quality
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    document.getElementById('m_img_preview').src = dataUrl;
                    document.getElementById('m_img_base64').value = dataUrl;
                }
            }
        }

        function renderDashboard() {
            const navContainer = document.getElementById('sectionNav');
            const itemsContainer = document.getElementById('itemsContainer');
            
            navContainer.innerHTML = '';
            itemsContainer.innerHTML = '';

            appData.sections.forEach(sec => {
                // Render Section Headers
                const secBtn = document.createElement('button');
                secBtn.className = "w-full text-left font-semibold text-gray-700 hover:bg-gray-100 px-3 py-2 rounded transition-colors";
                secBtn.innerText = sec.title;
                secBtn.onclick = () => {
                    document.getElementById('currentSectionTitle').innerText = sec.title;
                    document.getElementById('m_section').value = sec.id;
                    renderDashboardItems(sec.id);
                };
                navContainer.appendChild(secBtn);
            });

            // Default render first section
            if (appData.sections.length > 0) {
                document.getElementById('currentSectionTitle').innerText = appData.sections[0].title;
                renderDashboardItems(appData.sections[0].id);
            }
        }

        function renderDashboardItems(sectionId) {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            
            const section = appData.sections.find(s => s.id === sectionId);
            if (!section) return;

            section.items.forEach(item => {
                const isSoldOut = !item.available;
                container.innerHTML += `
                    <div class="flex items-center justify-between p-4 border border-gray-100 rounded-lg shadow-sm hover:shadow-md transition-shadow ${isSoldOut ? 'bg-gray-50 opacity-75' : 'bg-white'}">
                        <div class="flex items-center gap-4">
                            <img src="${item.img}" class="w-16 h-16 rounded-md object-cover border border-gray-200">
                            <div>
                                <h4 class="font-bold text-gray-800">${item.title} ${isSoldOut ? '<span class="text-xs text-red-500 font-black ml-2 uppercase">Sold Out</span>' : ''}</h4>
                                <p class="text-xs text-gray-500 line-clamp-1 max-w-xs">${item.desc}</p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editItem(${item.id})" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded">Edit</button>
                            <button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded">Delete</button>
                        </div>
                    </div>
                `;
            });
        }

        function openItemModal() {
            currentEditId = null;
            document.getElementById('itemForm').reset();
            document.getElementById('modalTitle').innerText = "Add Menu Item";
            document.getElementById('m_img_preview').src = "https://placehold.co/100x100?text=Upload";
            document.getElementById('m_img_base64').value = "";
            document.getElementById('modalPricingContainer').innerHTML = '';
            addModalPricingRow(); // add one empty row
            document.getElementById('itemModal').classList.remove('hide');
            document.getElementById('itemModal').classList.add('flex');
        }

        function closeItemModal() {
            document.getElementById('itemModal').classList.add('hide');
            document.getElementById('itemModal').classList.remove('flex');
        }

        function addModalPricingRow(label = '', price = '') {
            const container = document.getElementById('modalPricingContainer');
            const row = document.createElement('div');
            row.className = 'pricing-row flex gap-2 mt-2';
            row.innerHTML = `
                <input type="text" value="${label}" placeholder="Label (e.g. 1pc)" class="m_p_label w-2/3 px-3 py-1.5 border border-gray-300 rounded text-sm outline-none focus:border-orange-500">
                <input type="number" step="0.01" value="${price}" placeholder="Price" class="m_p_price w-1/3 px-3 py-1.5 border border-gray-300 rounded text-sm outline-none focus:border-orange-500">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 font-bold px-2">&times;</button>
            `;
            container.appendChild(row);
        }

        function editItem(id) {
            let foundItem = null;
            let foundSection = null;
            
            appData.sections.forEach(sec => {
                const item = sec.items.find(i => i.id === id);
                if (item) { foundItem = item; foundSection = sec.id; }
            });

            if (!foundItem) return;

            currentEditId = id;
            document.getElementById('modalTitle').innerText = "Edit Menu Item";
            document.getElementById('m_title').value = foundItem.title;
            document.getElementById('m_section').value = foundSection;
            document.getElementById('m_desc').value = foundItem.desc;
            document.getElementById('m_img_preview').src = foundItem.img;
            document.getElementById('m_img_base64').value = foundItem.img;
            
            document.getElementById('m_veg').checked = foundItem.veg;
            document.getElementById('m_gf').checked = foundItem.gf;
            document.getElementById('m_nuts').checked = foundItem.nuts;
            document.getElementById('m_loves').checked = foundItem.loves;
            document.getElementById('m_soldout').checked = !foundItem.available;

            const pricingContainer = document.getElementById('modalPricingContainer');
            pricingContainer.innerHTML = '';
            foundItem.options.forEach(opt => {
                addModalPricingRow(opt.l, opt.p);
            });

            document.getElementById('itemModal').classList.remove('hide');
            document.getElementById('itemModal').classList.add('flex');
        }

        function saveItem() {
            const title = document.getElementById('m_title').value.trim();
            if (!title) return alert("Title is required");

            const sectionId = document.getElementById('m_section').value;
            const targetSection = appData.sections.find(s => s.id === sectionId);
            
            // Collect pricing
            const options = [];
            document.querySelectorAll('.pricing-row').forEach(row => {
                const l = row.querySelector('.m_p_label').value.trim();
                const p = parseFloat(row.querySelector('.m_p_price').value);
                if (l && !isNaN(p)) options.push({ l, p });
            });
            if (options.length === 0) options.push({ l: "Standard", p: 0.00 }); // fallback

            let imgData = document.getElementById('m_img_base64').value || "https://placehold.co/800x600/f97316/white?text=No+Photo";

            const itemData = {
                id: currentEditId || Date.now(),
                title: title,
                desc: document.getElementById('m_desc').value.trim(),
                img: imgData,
                veg: document.getElementById('m_veg').checked,
                gf: document.getElementById('m_gf').checked,
                nuts: document.getElementById('m_nuts').checked,
                loves: document.getElementById('m_loves').checked,
                available: !document.getElementById('m_soldout').checked,
                options: options
            };

            if (currentEditId) {
                // Remove from old section if section changed, update if same
                appData.sections.forEach(sec => {
                    sec.items = sec.items.filter(i => i.id !== currentEditId);
                });
                targetSection.items.push(itemData);
            } else {
                targetSection.items.push(itemData);
            }

            saveData();
            closeItemModal();
        }

        function deleteItem(id) {
            if (!confirm("Are you sure you want to delete this item?")) return;
            appData.sections.forEach(sec => {
                sec.items = sec.items.filter(i => i.id !== id);
            });
            saveData();
        }

        // ==========================================
        // HTML GENERATOR LOGIC
        // ==========================================
        function downloadWebsite() {
            const tplTop = document.getElementById('tpl-top').innerHTML;
            const tplBottom = document.getElementById('tpl-bottom').innerHTML;
            
            let middleHTML = '';

            appData.sections.forEach(sec => {
                if (sec.items.length === 0) return; // Skip empty sections

                const isDessert = sec.style === 'dessert';
                const borderColor = isDessert ? 'border-pink-100' : 'border-gray-100';
                const btnBg = isDessert ? 'bg-pink-100 text-pink-600 hover:bg-pink-500 hover:text-white' : 'bg-brand/10 text-brand hover:bg-brand hover:text-white';
                const focusRing = isDessert ? 'focus:border-pink-500 focus:ring-pink-500' : 'focus:border-brand focus:ring-brand';
                const divColor = isDessert ? 'bg-pink-400' : 'bg-brand';
                const titleColor = isDessert ? 'text-pink-500' : 'text-brand-dark';

                // Section Header
                middleHTML += `
        <!-- ${sec.title} -->
        <div id="${sec.id}" class="mb-20 pt-16 -mt-16">
            <div class="reveal flex flex-col items-center justify-center mb-12 text-center">
                <div class="flex items-center mb-2">
                    <div class="h-1 w-8 md:w-12 ${divColor} rounded"></div>
                    <h2 class="text-3xl md:text-4xl font-[Playfair_Display] font-bold mx-4 ${titleColor}">${sec.title}</h2>
                    <div class="h-1 w-8 md:w-12 ${divColor} rounded"></div>
                </div>
                <p class="text-gray-600 max-w-2xl mt-4 px-4">${sec.subtitle}</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">`;

                // Section Items
                sec.items.forEach((item, idx) => {
                    const delay = (idx % 3 === 1) ? 'delay-100' : (idx % 3 === 2) ? 'delay-200' : '';
                    
                    let tagsHtml = '';
                    if (item.veg) tagsHtml += ' <span title="Vegetarian" class="text-lg">🍃</span>';
                    if (item.nuts) tagsHtml += ' <span title="Contains Nuts" class="text-lg">🥜</span>';
                    if (item.gf) tagsHtml += ' <span title="Gluten-Free" class="text-lg">🌾</span>';

                    let optionsHtml = '';
                    item.options.forEach(opt => {
                        const pDisp = opt.p === 0 ? 'Message for Price' : `$${opt.p.toFixed(2)}`;
                        optionsHtml += `<option value="${opt.p.toFixed(2)}|${opt.l}">${opt.l} - ${pDisp}</option>`;
                    });

                    const slugId = 'opt_' + item.id;

                    const badgeSoldOut = `
                    <div class="unavailable-overlay absolute inset-0 bg-black/20 z-20 items-center justify-center backdrop-blur-[2px]">
                        <div class="relative flex items-center justify-center transform -rotate-12 scale-110">
                            <svg class="w-32 h-32 text-red-600 drop-shadow-2xl" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                            <div class="absolute flex flex-col items-center text-white font-black tracking-widest leading-none pb-3 drop-shadow-md">
                                <span class="text-sm">SOLD</span>
                                <span class="text-xl">OUT</span>
                            </div>
                        </div>
                    </div>`;

                    const badgeLove = `
                    <div class="absolute top-4 left-4 bg-pink-500 text-white font-bold px-3 py-1.5 rounded-full text-xs uppercase tracking-wider shadow-lg flex items-center gap-1.5 z-10 border border-pink-400">
                        <svg class="w-3.5 h-3.5 fill-current heart-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> Love's Choice
                    </div>`;

                    middleHTML += `
                <div class="reveal ${delay} item-card bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 group flex flex-col border ${borderColor} relative" data-available="${item.available}">
                    ${!item.available ? badgeSoldOut : ''}
                    ${item.loves ? badgeLove : ''}
                    <div class="h-56 overflow-hidden relative">
                        <img src="${item.img}" alt="${item.title.replace(/"/g,'')}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700 ease-in-out">
                    </div>
                    <div class="p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800 mb-2">${item.title} ${tagsHtml}</h3>
                            <p class="text-gray-600 text-sm mb-4">${item.desc}</p>
                        </div>
                        <div class="mt-auto add-to-cart-section">
                            <select id="${slugId}" class="w-full mb-3 p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 ${focusRing} focus:border-transparent transition-all">
                                ${optionsHtml}
                            </select>
                            <button onclick="addToCart('${item.title.replace(/'/g,"\\'")}', '${slugId}')" class="w-full font-semibold py-2.5 rounded-lg transition duration-300 transform active:scale-95 ${btnBg}">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>`;
                });

                middleHTML += `
            </div>
        </div>`;
            });

            // Replace phone variable in bottom template
            let finalBottom = tplBottom.replace('__PHONE_NUMBER__', appData.phone || "642041280989");

            // Stitch it all together
            const finalHTML = tplTop + middleHTML + finalBottom;

            // Trigger Download
            const blob = new Blob([finalHTML], { type: 'text/html' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'index.html';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
